services:
  postgres:
    image: 'postgres:18.6'
    environment:
      POSTGRES_DB: ordermod
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'

volumes:
  postgres-data: