spring:
  application:
    name: ordermod

  datasource:
    url: jdbc:postgresql://localhost:5433/ordermod
    username: myuser
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ApplicationName: ordermod

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s

  opentelemetry:
    resource-attributes:
      deployment.environment: local

    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

  tracing:
    sampling:
      probability: 1.0

jdbc:
  includes: QUERY
  datasource-proxy:
    enabled: true
    include-parameter-values: false
    query:
      enable-logging: false
  opentelemetry:
    enabled: true
    spans:
      enabled: true
    metrics:
      enabled: true
    analysis:
      enabled: true
      summary:
        enabled: true
      sanitize:
        enabled: true


server:
  shutdown: immediate


logging:
  level:
    com.market: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: DEBUG
